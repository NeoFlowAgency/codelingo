{% extends 'base.html' %}
{% block content %}
<div class="top-bar">
  <button class="nav-btn" style="width:46px;height:46px;" onclick="location.href='/app/dashboard'">✕</button>
  <div class="progress-track"><div id="lessonProgress" class="progress-fill" style="width:15%"></div></div>
  <span id="lessonPercent">15%</span>
</div>
<div class="panel">
  <div style="display:flex; gap:12px; align-items:flex-start;">
    <div class="avatar" style="width:80px;height:80px;"></div>
    <div class="lesson-bubble" id="questionBox">Question</div>
  </div>
  <div style="margin-top:16px; border:4px solid #101184; border-radius:20px; overflow:hidden;">
    <div style="background:#101184;height:44px;"></div>
    <textarea id="codeInput" class="textarea" style="margin:0;border:none;border-radius:0;height:220px;font-family:monospace;"></textarea>
  </div>
  <div class="choice-grid" id="choices"></div>
  <button class="cta" onclick="submitLesson()">Valider</button>
  <div id="lessonMsg" class="hint"></div>
  <pre id="lessonOutput" class="code-block" style="min-height:70px;"></pre>
</div>
<script>initLessonPage()</script>
{% endblock %}
