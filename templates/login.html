{% extends 'base.html' %}
{% block content %}
<div style="padding-top:36px; text-align:center;">
  <div style="margin:0 auto; width:230px;">
    <div class="avatar" style="width:230px;height:230px;margin:0 auto;"></div>
  </div>
  <div class="logo-text">CodeLingo</div>
</div>
<div class="auth-card">
  <input id="email" class="input" placeholder="Email" type="email" />
  <input id="password" class="input" placeholder="Mot de passe" type="password" />
  <button class="cta" onclick="signup()">Créer un compte</button>
  <button class="cta secondary" onclick="login()">Connexion</button>
  <p class="hint">Après inscription, onboarding obligatoire.</p>
  <p id="authMsg" class="hint"></p>
</div>
{% endblock %}
