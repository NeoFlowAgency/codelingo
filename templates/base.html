<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeLingo Python</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
  <header class="sticky top-0 z-20 bg-slate-900/90 backdrop-blur border-b border-slate-800">
    <nav class="max-w-5xl mx-auto p-3 flex justify-between items-center">
      <a href="/dashboard" class="text-lg font-bold text-emerald-400">🐍 CodeLingo Python</a>
      <div class="flex gap-3 text-sm">
        <a href="/dashboard" class="hover:text-emerald-300">Dashboard</a>
        <a href="/lessons" class="hover:text-emerald-300">Parcours</a>
        <a href="/profile" class="hover:text-emerald-300">Profil</a>
        <button onclick="logout()" class="text-rose-300">Logout</button>
      </div>
    </nav>
  </header>
  <main class="max-w-5xl mx-auto p-4 md:p-6">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/app.js"></script>
</body>
</html>
